<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OMNIS V3 - Frontier Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0e14; color: #c8d6e5; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: auto; }
        h1 { color: #00d4ff; text-shadow: 0 0 20px #00d4ff88; font-weight: 300; letter-spacing: 2px; border-bottom: 1px solid #1e2a3a; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #151e2b; border-radius: 12px; padding: 20px; box-shadow: 0 0 30px #00000055; border: 1px solid #1e2a3a; }
        .card h3 { margin-top: 0; color: #64d8ff; font-weight: 300; }
        .stat-label { font-size: 0.8rem; color: #7a8ba0; text-transform: uppercase; letter-spacing: 1px; }
        .btn { background: #00d4ff; border: none; padding: 10px 20px; border-radius: 8px; color: #0b0e14; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #00b8e0; box-shadow: 0 0 30px #00d4ff66; }
        .flex { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        input, select { background: #1a2533; border: 1px solid #2a3a4a; color: #c8d6e5; padding: 8px 12px; border-radius: 6px; }
        .live { color: #00ff88; animation: pulse 1.5s infinite; }
        .bad { color: #ff5566; }
        .good { color: #00ff88; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .log { background: #0a0f16; padding: 10px; border-radius: 8px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; border: 1px solid #1e2a3a; }
        .log p { margin: 4px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>OMNIS V3 - Frontier Control</h1>
    <div class="grid">
        <div class="card">
            <h3>Simulation Control</h3>
            <div class="flex">
                <div><label>API Key</label><br><input type="password" id="apiKey" placeholder="paste key" style="width:220px;"></div>
            </div>
            <div class="flex" style="margin-top:10px;">
                <div><label>Seed</label><input type="number" id="seed" value="42" style="width:80px;"></div>
                <div><label>Generations</label><input type="number" id="gens" value="10" min="1" max="50" style="width:80px;"></div>
                <button class="btn" id="startBtn">Start</button>
            </div>
            <div style="margin-top:15px;">
                <span class="stat-label">Status</span>
                <span id="status" style="color:#ffaa00;">Idle</span>
            </div>
        </div>
        <div class="card">
            <h3>VERITY Advisor Status</h3>
            <div id="advisorStatus" class="log"><p>Checking...</p></div>
            <button class="btn" id="refreshHealthBtn" style="margin-top:10px;">Refresh</button>
        </div>
        <div class="card">
            <h3>Latest Lineages</h3>
            <div id="lineageList" class="log"><p>No data yet.</p></div>
        </div>
        <div class="card">
            <h3>VERITY Advisor</h3>
            <button class="btn" id="adviseBtn">Get Advice</button>
            <div id="adviceOutput" class="log" style="margin-top:10px;"><p>Press the button to get advice.</p></div>
        </div>
        <div class="card">
            <h3>Telemetry <span class="live">LIVE</span></h3>
            <div id="telemetryLog" class="log"><p>Waiting for data...</p></div>
        </div>
    </div>
</div>
<script>
    const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${wsProtocol}://${window.location.host}/ws`);
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'telemetry') {
            const log = document.getElementById('telemetryLog');
            const data = msg.data;
            if (data && data.length) {
                const last = data[data.length - 1];
                log.innerHTML = `<p>Last update: ${JSON.stringify(last).slice(0, 100)}...</p>`;
            }
        }
    };

    function apiKeyHeaders() {
        const key = document.getElementById('apiKey').value;
        return { 'Content-Type': 'application/json', 'X-API-Key': key };
    }

    async function fetchHealth() {
        const box = document.getElementById('advisorStatus');
        try {
            const resp = await fetch('/api/health');
            const data = await resp.json();
            const a = data.advisor;
            const cls = a.loaded ? 'good' : 'bad';
            box.innerHTML = `
                <p>Backend: ${a.backend}</p>
                <p>Model path: ${a.model_path || '(none found)'}</p>
                <p class="${cls}">Loaded: ${a.loaded}</p>
                <p>BLOOM engine available: ${data.bloom_available}</p>
            `;
        } catch (e) {
            box.innerHTML = '<p class="bad">Could not reach /api/health</p>';
        }
    }
    document.getElementById('refreshHealthBtn').addEventListener('click', fetchHealth);
    fetchHealth();

    document.getElementById('startBtn').addEventListener('click', async () => {
        const seed = document.getElementById('seed').value;
        const gens = document.getElementById('gens').value;
        const resp = await fetch('/api/sim/start', {
            method: 'POST',
            headers: apiKeyHeaders(),
            body: JSON.stringify({ seed: parseInt(seed), generations: parseInt(gens) })
        });
        if (!resp.ok) {
            document.getElementById('status').textContent = 'Error: ' + resp.status;
            return;
        }
        const data = await resp.json();
        document.getElementById('status').textContent = 'Running sim ' + data.sim_id;
        setTimeout(fetchLineages, 2000);
    });

    async function fetchLineages() {
        const resp = await fetch('/api/sim/latest');
        const data = await resp.json();
        const list = document.getElementById('lineageList');
        if (data.lineages && data.lineages.length) {
            list.innerHTML = data.lineages.map(l => `<p>ID ${l.id} | Gen ${l.gen} | Total ${l.total} | Life ${l.lifespan}</p>`).join('');
        } else {
            list.innerHTML = '<p>No lineages yet.</p>';
        }
    }

    document.getElementById('adviseBtn').addEventListener('click', async () => {
        const resp = await fetch('/api/sim/latest');
        const data = await resp.json();
        if (!data.lineages || data.lineages.length === 0) {
            document.getElementById('adviceOutput').innerHTML = '<p>No lineage to advise on.</p>';
            return;
        }
        const latest = data.lineages[data.lineages.length - 1];
        const advResp = await fetch('/api/advisor/advise', {
            method: 'POST',
            headers: apiKeyHeaders(),
            body: JSON.stringify(latest)
        });
        if (!advResp.ok) {
            document.getElementById('adviceOutput').innerHTML = '<p>Error: ' + advResp.status + '</p>';
            return;
        }
        const advice = await advResp.json();
        document.getElementById('adviceOutput').innerHTML = `
            <p><strong>Backend:</strong> ${advice.backend}</p>
            <p><strong>Action:</strong> ${advice.action}</p>
            <p><strong>Reason:</strong> ${advice.reason}</p>
        `;
    });

    fetchLineages();
</script>
</body>
</html>
